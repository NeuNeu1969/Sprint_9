name: UI tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull browser image for Selenoid
        run: docker pull selenoid/chrome:128.0

      - name: Run tests in Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure_results
